<extend template="base.shtml">
<head id="head">
	<style>.main-nav a[href="/"] { color: var(--accent); }</style>
</head>
<body id="body">
	<main>
		<div class="posts-list">
			<div :loop="$site.page('posts').subpages()">
				<div class="post-item">
					<span class="post-date" :text="$loop.it.date.format('Jan 02, 2006')"></span>
					<a class="post-title" href="$loop.it.link()" :text="$loop.it.title"></a>
				</div>
			</div>
		</div>
	</main>
</body>
