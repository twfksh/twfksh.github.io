<extend template="base.shtml">
<head id="head">
	<style>.main-nav a[href="/"] { color: var(--accent); }</style>
</head>
<body id="body">
	<main>
		<div class="post-header">
			<h1 :text="$page.title"></h1>
			<div class="post-meta">
				<span :text="$page.date.format('January 02, 2006')"></span>
			</div>
		</div>
		<div class="post-body" :html="$page.content()"></div>
	</main>
</body>
